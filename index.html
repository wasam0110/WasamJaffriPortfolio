<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ─────────────────────────────────────────────────────────────────
         SECURITY — Content Security Policy
         Restricts what resources the page can load.
         Update 'connect-src' if you add a backend API for the chat widget.
         ───────────────────────────────────────────────────────────────── -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src  'self' 'unsafe-inline';
        style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src    'self' https://fonts.gstatic.com;
        img-src     'self' data:;
        connect-src 'self' https://api.anthropic.com;
      "
    />

    <!-- ─── Google Fonts (loaded in <head> for best performance) ──────── -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Raleway:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- ─── Open Graph — controls link preview on LinkedIn / WhatsApp ─── -->
    <!-- Replace the image URL with a real 1200×630px screenshot once live -->
    <meta property="og:title"       content="Wasam Jaffri | AI Engineer" />
    <meta property="og:description" content="AI Engineer · ML Practitioner · Backend Developer based in Karachi" />
    <meta property="og:image"       content="/og-preview.png" />
    <meta property="og:url"         content="https://wasamjaffri.dev" />
    <meta name="twitter:card"       content="summary_large_image" />

    <title>Wasam Jaffri | AI Engineer</title>
    <meta
      name="description"
      content="Portfolio of Syed Muhammad Wasam Mehdi Jaffri — AI Engineer, ML Practitioner, Backend Developer based in Karachi, Pakistan."
    />
  </head>
  <body>
    <!-- React mounts the entire application here -->
    <div id="root"></div>
    <!-- Vite auto-injects the compiled JS bundle -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
